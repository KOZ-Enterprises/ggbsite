config:
  # Allow long technical lines in docs/posts.
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD033: false  # inline HTML is common in Jekyll content
  MD041: false  # front-matter means files won't start with a heading

globs:
  - "**/*.md"

ignores:
  - "_site/**"
  - ".jekyll-cache/**"
  - "vendor/**"
  - "node_modules/**"
