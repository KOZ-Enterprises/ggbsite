inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.1
  NewCops: disable
  Exclude:
    - '_site/**/*'
    - '.jekyll-cache/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

# Pinned rather than left at the default "native", which resolves to CRLF on
# Windows and LF on Linux. .gitattributes stores and checks out LF everywhere,
# so without this RuboCop passes in CI and fails on a Windows working copy.
Layout/EndOfLine:
  EnforcedStyle: lf
