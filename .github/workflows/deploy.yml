name: Build, Push, and Deploy

on:
  push:
    branches:
      - publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_PROJECT_ID: gary-gigabytes
  GCP_REGION: us-central1
  GCR_IMAGE: gcr.io/gary-gigabytes/ggbsite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and push image to GCR via Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit . \
            --tag ${{ env.GCR_IMAGE }}:latest \
            --project ${{ env.GCP_PROJECT_ID }} \
            --async --format='value(id)')
          echo "Build submitted: $BUILD_ID"
          echo "Waiting for build to complete..."
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project ${{ env.GCP_PROJECT_ID }} --format='value(status)')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Build succeeded!"
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy ggbsite to Cloud Run
        run: |
          gcloud run deploy ggbsite \
            --image ${{ env.GCR_IMAGE }}:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 80 \
            --project ${{ env.GCP_PROJECT_ID }}
