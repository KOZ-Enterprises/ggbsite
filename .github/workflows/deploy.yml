name: Build, Push, and Deploy

on:
  push:
    branches:
      - publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_PROJECT_ID: gary-gigabytes
  GCP_REGION: us-central1
  GCR_IMAGE: gcr.io/gary-gigabytes/ggbsite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image to GCR via Cloud Build
        run: |
          gcloud builds submit . \
            --tag ${{ env.GCR_IMAGE }}:latest \
            --project ${{ env.GCP_PROJECT_ID }} \
            --suppress-logs

      - name: Deploy ggbsite to Cloud Run
        run: |
          gcloud run deploy ggbsite \
            --image ${{ env.GCR_IMAGE }}:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 80 \
            --project ${{ env.GCP_PROJECT_ID }}
