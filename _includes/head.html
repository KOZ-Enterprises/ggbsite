<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Gary Gigabytes" }}</title>
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ page.title | default: 'Gary Gigabytes – Tech Projects & Portfolio' }}">
    <meta property="og:description"
        content="{{ page.description | default: 'Explore personal tech projects, CS coursework, and creative engineering from Gary Gigabytes.' }}">
    <meta property="og:image" content="https://garygigabytes.com/assets/imgs/ggbytes-preview.png">
    <meta property="og:url" content="https://garygigabytes.com{{ page.url }}">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags (optional but recommended) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: 'Gary Gigabytes – Tech Projects & Portfolio' }}">
    <meta name="twitter:description"
        content="{{ page.description | default: 'Explore personal tech projects, CS coursework, and creative engineering from Gary Gigabytes.' }}">
    <meta name="twitter:image" content="https://garygigabytes.com/assets/imgs/ggbytes-preview.png">

    <!-- Stylesheets and Scripts -->
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="{{ '/assets/js/scripts.js' | relative_url }}" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        document.querySelectorAll('code.language-mermaid').forEach(el => {
            const pre = el.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = el.textContent;
            pre.replaceWith(div);
        });
        await mermaid.run();
    </script>
</head>
