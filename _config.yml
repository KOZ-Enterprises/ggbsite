collections:
  csumb:
    output: true
    permalink: /csumb/:name/

  projects:
    output: true
    permalink: /projects/:name/

# Scaffolding, not content. These still contain literal [GITHUB_LINK] /
# [PDF_LINK] placeholders and relative asset paths that resolve nowhere, so
# publishing them ships broken pages.
exclude:
  - template/
  - test.html

plugins:
  - jekyll-redirect-from
  - jekyll-paginate

paginate: 10
paginate_path: "/page:num/"

excerpt_separator: "<!--more-->"
