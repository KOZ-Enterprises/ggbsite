---
layout: default
---

<!-- Post Title -->
<h1 class="post-title">{{ page.title }}</h1>

<!-- Post Metadata -->
<p class="post-meta">
    Published on {{ page.date | date: "%B %d, %Y" }}
    
</p>

{% if post.tags %}
<div class="post-tags">
    {% for tag in post.tags %}
    <span class="tag">
        #{{ tag }}
    </span>
    {% endfor %}
</div>
{% endif %}

<!-- Post Content -->
<div class="post-content">
    {{ content }}
</div>
