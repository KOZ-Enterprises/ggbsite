---
layout: default
---
<div class="post-page">
    <header class="post-header">
        <h1 class="post-title pop-heading section-header">{{ page.title }}</h1>
        <div class="post-meta">
            <span><i class="fa-regular fa-calendar"></i> {{ page.date | date: "%B %d, %Y" }}</span>
        </div>

        {% if page.tags %}
        <div class="post-tags">
            {% for tag in page.tags %}
            {% assign custom_url = site.data.tag_links[tag] %}
            {% if custom_url %}
            <a class="tag" href="{{ custom_url }}">#{{ tag }}</a>
            {% else %}
            <a class="tag" href="/tags/{{ tag | slugify }}/">#{{ tag }}</a>
            {% endif %}
            {% endfor %}
        </div>
        {% endif %}
    </header>

    <article class="post-content">
        {{ content }}
    </article>
</div>
