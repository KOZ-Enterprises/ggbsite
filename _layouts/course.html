---
layout: default

---


<h1 class="heading">{{ page.title }}</h1>

{{ content }}


<!-- Posts -->
{% assign filtered_posts = site.posts | where: "tags", page.slug %}
{% if filtered_posts.size > 0 %}
{% for post in filtered_posts %}
{% include post.html post=post type="excerpt"  %}
{% endfor %}
{% else %}
<p>...</p>
{% endif %}
