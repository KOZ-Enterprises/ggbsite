---
layout: default
---

<h1>Posts Tagged: "{{ page.tag }}"</h1>
<ul class="post-list">
    {% for post in site.posts %}
    {% if post.tags contains page.tag %}
    <li>
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p class="date">{{ post.date | date: "%B %d, %Y" }}</p>
        <p class="excerpt">{{ post.excerpt }}</p>
    </li>
    {% endif %}
    {% endfor %}
</ul>
